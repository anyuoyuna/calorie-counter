spring.application.name=life-assistant
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/life_assistant}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:your_password}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=${TELEGRAM_BOT_USERNAME}

google.sheets.id=${GOOGLE_SHEETS_ID}
google.sheets.operations-sheet-id=${GOOGLE_SHEETS_GID:0}
google.credentials.json=${GOOGLE_CREDENTIALS_JSON:}
#google.credentials.path=classpath:google-credentials.json

gemini.chat-model=gemini-3.1-flash-lite
gemini.api.key=${GEMINI_API_KEY}

logging.level.dev.langchain4j=DEBUG

google.gmail.client-id=${GMAIL_CLIENT_ID}
google.gmail.client-secret=${GMAIL_CLIENT_SECRET}
google.gmail.refresh-token=${GMAIL_REFRESH_TOKEN}