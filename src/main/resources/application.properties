spring.application.name=life-assistant
spring.datasource.url=jdbc:postgresql://localhost:5432/life_assistant
spring.datasource.username=postgres
spring.datasource.password=your_password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=${TELEGRAM_BOT_USERNAME}
gemini.api.key=${GEMINI_API_KEY}

google.sheets.id=1Ym-ciTqa-KW3ezEEsUNfkYQERUA3rqgufC-Cl9i7YNk
google.sheets.operations-sheet-id=876838988
google.credentials.path=classpath:google-credentials.json

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

gemini.chat-model=gemini-3.1-flash-lite

logging.level.dev.langchain4j=DEBUG
#logging.level.org.springframework.kafka=DEBUG
#logging.level.org.apache.kafka.clients.consumer=DEBUG

google.gmail.client-id=${GMAIL_CLIENT_ID}
google.gmail.client-secret=${GMAIL_CLIENT_SECRET}
google.gmail.refresh-token=${GMAIL_REFRESH_TOKEN}

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

